name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: i18n check
        run: npx tsx scripts/i18n-check.ts

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Bundle size budget
        run: npm run size
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Start production server
        run: npm run start &
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Wait for server
        run: npx wait-on http://localhost:3000

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Screenshot comparison is Chromium-only (see issue #133 scope).
      # Baselines live in the repo under tests/visual/*-snapshots/.
      # To intentionally update baselines, run locally:
      #   npx playwright test --grep @visual --update-snapshots
      # then commit the updated snapshot files.

      - name: Run E2E tests
        run: npx playwright test --grep-invert @visual
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual-regression:
    name: Playwright Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Screenshot comparison is Chromium-only (see issue #133 scope).
      # Baselines live in the repo under tests/visual/*-snapshots/.
      # To intentionally update baselines, run locally:
      #   npx playwright test --grep @visual --update-snapshots
      # then commit the updated snapshot files.
      - name: Run visual regression tests
        run: npx playwright test --grep @visual
        env:
          CI: 'true'

      - name: Upload visual diff artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: lighthouse · budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Start production server
        run: npm run start &
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Bundle size budget
        run: npm run size
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the build on any high/critical advisory that has no available
      # fix. Advisories with no upstream fix yet are allowlisted in
      # .audit-ci.json with a required justification comment (see
      # docs/dependency-policy.md for the triage process).
      - name: Audit (high/critical)
        run: npx --yes audit-ci --config .audit-ci.json --high

