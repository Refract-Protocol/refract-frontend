name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the build on any high/critical advisory that has no available
      # fix. Advisories with no upstream fix yet are allowlisted in
      # .audit-ci.json with a required justification comment (see
      # docs/dependency-policy.md for the triage process).
      - name: Audit (high/critical)
        run: npx --yes audit-ci --config .audit-ci.json --high
